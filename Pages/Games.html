<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CsSsS/CSS.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <script src="../Javana/Javaskripts.js" defer></script>
    <title>Игра «Найди пару»</title>
</head>
<body>
    <header>
        <a href="../index.html">
            <div class="header-logo">
                <img class="logo-icon" src="../Images/mazok.png">
                <img class="logo-text" src="../Images/LogTex.png">
            </div>
        </a>
        <nav class="header-menu">
            <a href="Service.html">Услуги</a>
            <a href="Orders.html">Оформить заказ</a>
            <a href="AboutUs.html">О нас</a>
            <a href="Games.html" class="a-active">Игра</a>
        </nav>
        <div class="header-settings">
            <button class="setting-button palette-toggle" type="button" aria-label="Оливковая палитра" aria-pressed="false">
                <span id="palette">Палитра</span>
            </button>
            <button class="setting-button brush-toggle" type="button" aria-pressed="true">
                Кисть: вкл
            </button>
        </div>
    </header>
    
    <section class="section section-game">
        <h2>Найди пару</h2>

        <div class="game-content">
            <p class="game-description">
                Открывай по&nbsp;две карточки и&nbsp;запоминай картинки.<br>
                Найди все шесть пар за&nbsp;минуту.
            </p>

            <div class="game-info">
                <span>Время: <b id="game-time">60</b> с</span>
                <span>Пары: <b id="game-pairs">0</b> из 6</span>
                <span>Ходы: <b id="game-moves">0</b></span>
            </div>

            <div class="game-field" id="game-field" role="group" aria-label="Игровое поле"></div>

            <div class="game-buttons">
                <button class="button" id="game-start" type="button">Начать игру</button>
                <button class="game-pause" id="game-pause" type="button" disabled>Пауза</button>
            </div>

            <p class="game-message" id="game-message" role="status"></p>
        </div>
    </section>

    <footer>
        <a href="../index.html">
            <div class="header-logo">
                <img class="logo-icon" src="../Images/mazok.png">
                <img class="logo-text" src="../Images/LogTex.png">
            </div>
        </a>
        <nav class="footer-menu">
            <a href="Service.html">Услуги</a>
            <a href="Orders.html">Оформить заказ</a>
            <a href="AboutUs.html">О нас</a>
            <a href="Games.html">Игра</a>
        </nav>
        <div class="contacts">
            <p>+7 (987) 654-32-10</p>
            <p>info@tochka.tsveta.ru</p>
            <p>Самара, ул. Садовая, 18 </p>
        </div>
    </footer>
</body>
</html>
