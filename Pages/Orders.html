<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CsSsS/CSS.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <script src="../Javana/Javaskripts.js" defer></script>
    <title>Услуги</title>
</head>
<body>
    <header>
        <a href="../index.html">
            <div class="header-logo">
                <img class="logo-icon" src="../Images/mazok.png">
                <img class="logo-text" src="../Images/LogTex.png">
            </div>
        </a>
        <nav class="header-menu">
            <a href="Service.html">Услуги</a>
            <a href="Orders.html" class="a-active">Оформить заказ</a>
            <a href="AboutUs.html">О нас</a>
            <a href="Games.html">Игра</a>
        </nav>
        <div class="header-settings">
            <button class="setting-button palette-toggle" type="button" aria-label="Оливковая палитра" aria-pressed="false">
                <span id="palette">Палитра</span>
            </button>
            <button class="setting-button brush-toggle" type="button" aria-pressed="true">
                Кисть: вкл
            </button>
        </div>
    </header>
    
    <section>
        <div class="service-heading">
            <h2>Расскажите, что вам близко</h2>
            <p class="service-text">
                Выберите параметры будущей картины
            </p>
        </div>

        <form class="order-form">
            <div class="input-wrapper input-wide">
                <label for="name">Ваше имя</label>
                <input type="text" name="name" placeholder="Как к вам обращаться" required>
            </div>
            <div class="input-wrapper input-wide">
                <label for="contact">Контакт для связи</label>
                <input type="text" name="contact" placeholder="Телефон или email" required>
            </div>

            <div class="two-inputs">
                <div class="input-wrapper input-50">
                    <label for="subject">Что заказываем?</label>
                    <select name="subject" required>
                        <option value="own-idea">Картина по своей идее</option>
                        <option value="landscape">Пейзаж</option>
                        <option value="stillife">Натюрморт</option>
                        <option value="portrait">Портрет</option>
                    </select>
                </div>
                <div class="input-wrapper input-50">
                    <label for="size">Размер</label>
                    <select name="size" required>
                        <option value="30-40">30х40</option>
                        <option value="40-50">40х50</option>
                        <option value="50-70">50х70</option>
                        <option value="custom-size">Свой размер — укажу в пожеланиях</option>
                    </select>
                </div>
            </div>

            <div class="two-inputs">
                <div class="input-wrapper input-50">
                    <label for="material">Техника</label>
                    <select name="material" required>
                        <option value="oil">Масло</option>
                        <option value="watercolor">Акварель</option>
                        <option value="pencil">Карандаш</option>
                        <option value="choice">Нужна помощь с выбором</option>
                    </select>
                </div>
                <div class="input-wrapper input-50">
                    <label for="date">Желаемая дата</label>
                    <input type="date">
                </div>
            </div>

            <div class="input-wrapper input-wide">
                <label for="idea">Ваша идея</label>
                <textarea name="idea" placeholder="Сюжет, цвета, количество людей, пожелания к фону и т.д." required></textarea>
            </div>
            <p class="form-text text-opacity">Стоимость и срок согласуются с художником после обсуждения заявки</p>
            <button class="button form-button" type="submit">Отправить заявку</button>
        </form>
    </section>

    <footer>
        <a href="../index.html">
            <div class="header-logo">
                <img class="logo-icon" src="../Images/mazok.png">
                <img class="logo-text" src="../Images/LogTex.png">
            </div>
        </a>
        <nav class="footer-menu">
            <a href="Service.html">Услуги</a>
            <a href="Orders.html">Оформить заказ</a>
            <a href="AboutUs.html">О нас</a>
            <a href="Games.html">Игра</a>
        </nav>
        <div class="contacts">
            <p>+7 (987) 654-32-10</p>
            <p>info@tochka.tsveta.ru</p>
            <p>Самара, ул. Садовая, 18 </p>
        </div>
    </footer>
</body>
</html>
